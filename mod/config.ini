[menu]
title=永动接线器

[field.enabled]
type=bool
label=启用录屏演出
description=启用/关闭断线演出效果。
default=true

[field.fast_failure]
type=bool
label=快速结束重连
description=快速触发重连失败并返回登录界面。关闭则等待游戏自然超时。
default=true

[field.failure_delay]
type=number
label=重连失败演出延迟
description=触发后断开连接的延迟时间（秒）。
min=1
max=15
step=1
default=3

[field.timeout]
type=number
label=断网自动恢复秒数
description=演出超时自动恢复时间（秒），回到登录页后也会自动恢复。
min=15
max=180
step=1
default=120

[field.message]
type=string
label=假封禁提示正文
description=登录弹窗提示内容，支持使用 \n 换行。
min_length=1
max_length=900
format=plain_text
default=由于您的账号存在违规行为，此账号已被封禁至\n2099/12/31 23:59 (UTC+8)。如有疑问，请联系客服。\n封禁理由：【骑乘摩托车未佩戴头盔】

[field.show_notice]
type=bool
label=显示演出说明
description=在弹窗末尾附加“视频演出 · 非真实封禁”提示文字。
default=true
